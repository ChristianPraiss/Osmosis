name: Release

on:
  release:
    types: [published]

jobs:
  validate:
    name: Validate Package
    runs-on: macos-15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16'

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v
